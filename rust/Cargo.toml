cargo-features = ["codegen-backend"]

[profile.release_default]
inherits = "release"

[profile.release_gcc]
inherits = "release"
codegen-backend = "gcc"

[package]
name = "silo-rust"
version = "0.0.1"
edition = "2024"

[dependencies]
regex = "1.13"
parking_lot = "0.13"
concurrent-queue = "2.5"
blown_queue = { path = "../../blown_queue/rust" }

[[bin]]
name = "silo"
path = "src/silo.rs"
